baseURL = 'https://positivepeng.github.io/'
languageCode = 'en-us'
title = 'Phil的碎碎念'
theme = 'PaperMod'

# 启用标签和分类
[taxonomies]
  tag = 'tags'
  category = 'categories'

# 菜单配置
[[menu.main]]
  name = '搜索'
  url = '/search/'
  weight = 1

[[menu.main]]
  name = '标签'
  url = '/tags/'
  weight = 2

[[menu.main]]
  name = '分类'
  url = '/categories/'
  weight = 3

[[menu.main]]
  name = '存档'
  url = '/archives/'
  weight = 4

[[menu.main]]
  name = '关于'
  url = '/about/'
  weight = 5

# 搜索配置
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 首页信息
[params.homeInfoParams]
  Title = "Phil的碎碎念"
  Content = """
  INTJ | 长期主义 | 普普通通的算法工程师
  """
  AlignSocialIconsTo = "left"

# 社交账号图标
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/positivepeng"

[[params.socialIcons]]
  name = "zhihu"
  url = "https://www.zhihu.com/people/jie-sheng-hao"
